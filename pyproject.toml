[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keeper"
version = "0.1.0"
description = "项目级持久化 Agent（CLI）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
keeper = "keeper.cli:main"

[tool.setuptools.packages.find]
include = ["keeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]